[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillbench"
version = "0.1.0"
description = "Agent Skills for AI-infra work, plus the harness that measures whether they help."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Enoch Nemili" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "skills-ref>=0.1.1"]

[project.scripts]
skillbench = "skillbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
